<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monster Maze</title>
<link rel="stylesheet" href="play.css">
</head>
<body>
<section id="deep">
  <canvas id="view" aria-label="The maze, seen through your eyes"></canvas>
  <div id="overview" hidden>
    <canvas id="map" aria-label="Map of the maze"></canvas>
    <p class="legend">
      <span class="you">&#9650; you</span>
      <span class="others">&#9679; other players</span>
      <span class="monster">&#9679; monster</span>
      <span class="goal">&#9733; goal</span>
    </p>
  </div>
  <div class="hud">
    <span id="level"></span>
    <span id="clock"></span>
    <span id="here"></span>
    <button id="mute" aria-label="Sound on or off">&#128266;</button>
  </div>
  <p class="hint" id="hint">The map turns with you: your arrow always points up. Up goes forward, left and right turn and go, down turns around. Space or a tap stops and shows the map.</p>
</section>

<div id="cover">
  <div id="card">
    <p id="message"></p>
    <p id="detail"></p>
    <button id="start" hidden>Start</button>
    <p id="keys" hidden>Enter or space starts. Wear headphones: you can hear where the monster is.</p>
  </div>
</div>
<script type="module" src="play.js"></script>
</body>
</html>
