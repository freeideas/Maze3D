[project]
name = "maze3d"
version = "0.1.0"
description = "Monster Maze: a fast multiplayer maze with a monster, at maze3d.endlessmind.com"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
maze3d-server = "maze3d_server.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright==1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/maze3d_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
